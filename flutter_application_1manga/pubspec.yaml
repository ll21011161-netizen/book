name: gun_book
description: "專屬於寶寶的漫畫閱讀神器 - 槍簿"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5 
  file_picker: ^10.3.10 
  shared_preferences: ^2.5.4
  uuid: ^4.5.3
  provider: ^6.1.5+1
  shimmer: ^3.0.0
  flutter_staggered_animations: ^1.1.1
  fluid_bottom_nav_bar: ^1.4.0
  google_fonts: ^6.2.1
  image: ^4.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  # ✨ 關鍵：用來把 App 圖示變成「手槍」的工具
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0

# ✨ 設定手槍圖示的路徑
# 請確保你已經把手槍圖片放在 assets/icon/app_icon.png
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  
  # 如果你的手槍圖示是放在 assets 資料夾，雖然圖示工具會自己抓，
  # 但為了保險起見，我們還是宣告一下資源路徑
  assets:
    - assets/icon/